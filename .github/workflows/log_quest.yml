name: Log SQL Quest

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic'
        required: true
      problems:
        description: 'Problems Solved'
        required: true
      logic:
        description: 'Logic Learned'
        required: true
      resource:
        description: 'Resource'
        required: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update Streak and Table
        run: |
          DATE_DISPLAY=$(date -u +"%d %b %Y")
          DATE_FULL=$(date -u +"%Y-%m-%d")
          YESTERDAY=$(date -u -d "yesterday" +"%Y-%m-%d")

          # Extract current streak
          CURRENT_STREAK=$(grep "🔥 Current Streak:" README.md | grep -o '[0-9]\+' || echo "0")
          LAST_DATE=$(grep "_Last updated:" README.md | grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' || echo "")

          if [ -z "$CURRENT_STREAK" ]; then
            CURRENT_STREAK=0
          fi

          # Prevent logging twice same day
          if [ "$LAST_DATE" = "$DATE_FULL" ]; then
            echo "Already logged today."
            exit 0
          fi

          # Streak logic
          if [ "$LAST_DATE" = "$YESTERDAY" ]; then
            NEW_STREAK=$((CURRENT_STREAK + 1))
          else
            NEW_STREAK=1
          fi

          # Update streak + date
          sed -i "s/🔥 Current Streak:.*/🔥 Current Streak: $NEW_STREAK/" README.md
          sed -i "s/_Last updated:.*/_Last updated: $DATE_FULL_/" README.md

          # Build new table row
          NEW_ROW="| $DATE_DISPLAY | ${{ github.event.inputs.topic }} | ${{ github.event.inputs.problems }} | ${{ github.event.inputs.logic }} | ${{ github.event.inputs.resource }} | ✅ |"

          # Insert row right after the table separator line
          awk -v row="$NEW_ROW" '
          /^\|[-]+/ && !done {
              print
              print row
              done=1
              next
          }
          { print }
          ' README.md > temp.md

          mv temp.md README.md

      - name: Commit changes
        run: |
          git config user.name "Quest-Bot"
          git config user.email "actions@github.com"
          git add README.md

          # Only commit if changes exist
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "⚔️ SQL Quest: ${{ github.event.inputs.topic }}"
          git push
