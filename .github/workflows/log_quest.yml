name: Log SQL Quest
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic'
        required: true
      problems:
        description: 'Probs Solved'
        required: true
      logic:
        description: 'Logic Learned'
        required: true
      resource:
        description: 'Resource'
        required: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculate Streak and Add Row
        run: |
          DATE_DISPLAY=$(date +"%d %b")
          DATE_FULL=$(date +"%Y-%m-%d")
          YESTERDAY=$(date -d "yesterday" +"%Y-%m-%d")
          
          # 1. Get Current Streak (Finds any number after "Current Streak:")
          CURRENT_STREAK=$(grep -i "Current Streak:" README.md | grep -oE "[0-9]+" || echo "0")
          
          # 2. Get Last Updated Date
          LAST_DATE=$(grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2}" README.md | head -n 1 || echo "None")

          # 3. Streak Logic
          if [ "$LAST_DATE" == "$YESTERDAY" ]; then
            NEW_STREAK=$((CURRENT_STREAK + 1))
          elif [ "$LAST_DATE" == "$DATE_FULL" ]; then
            NEW_STREAK=$CURRENT_STREAK
          else
            NEW_STREAK=1
          fi

          # 4. Build the Row
          NEW_ROW="| $DATE_DISPLAY | ${{ github.event.inputs.topic }} | ${{ github.event.inputs.problems }} | ${{ github.event.inputs.logic }} | ${{ github.event.inputs.resource }} | [x] |"
          
          # 5. Update README (Find & Replace logic)
          sed -i "s/Current Streak: [0-9]*/Current Streak: $NEW_STREAK/" README.md
          sed -i "s/_Last updated:.*_/_Last updated: ${DATE_FULL}_/" README.md
          echo "$NEW_ROW" >> README.md
          
      - name: Commit changes
        run: |
          git config user.name "Quest-Bot"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "⚔️ Quest Logged: ${{ github.event.inputs.topic }}"
          git push
